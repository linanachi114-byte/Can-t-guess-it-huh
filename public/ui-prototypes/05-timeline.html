<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猜不到吧 UI 原型 05 - 时间线优先</title>
    <link rel="stylesheet" href="./prototype.css" />
    <style>
      .timeline-layout {
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 18px;
      }

      .control-panel {
        display: grid;
        align-content: start;
        gap: 14px;
      }

      .compact-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .compact-stats .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .timeline {
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 12px;
      }

      .dot {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        color: white;
        background: var(--accent);
        font-weight: 900;
      }

      .timeline-bubble {
        display: grid;
        gap: 8px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }

      .auto-card {
        border-color: #bdd0f1;
        background: #f2f6ff;
      }

      @media (max-width: 900px) {
        .timeline-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img src="../nanachi-project-logo.png" alt="" />
        <div><p class="eyebrow">AI 猜词游戏</p><h1>猜不到吧</h1></div>
      </header>
      <nav class="prototype-tabs">
        <a href="./01-focus.html">01 聚焦问答</a>
        <a href="./02-sidebar.html">02 侧边栏</a>
        <a href="./03-bottom-actions.html">03 底部动作</a>
        <a href="./04-drawer.html">04 工具抽屉</a>
        <a class="active" href="./05-timeline.html">05 时间线</a>
      </nav>
      <p class="layout-note">方案重点：把“对局历史”作为中心内容，输入区变成左侧控制台。适合普通模式和“连环探问”统一呈现。</p>
      <section class="board timeline-layout">
        <aside class="control-panel">
          <div class="topbar" style="grid-template-columns:52px 1fr 52px">
            <button class="icon-btn">←</button>
            <button class="secondary">自然与生物</button>
            <button class="icon-btn">↻</button>
          </div>
          <div class="compact-stats">
            <div class="stat"><span>提问次数</span><strong>2</strong></div>
            <div class="stat"><span>猜测次数</span><strong>0</strong></div>
          </div>
          <section class="hint-board">
            <h3><span>线索板</span><small>已展示 1/3</small></h3>
            <ol><li>自然界中常见</li></ol>
          </section>
          <div class="question-input" style="grid-template-columns:1fr;margin-top:0">
            <input placeholder="继续问一个是/否问题" />
          </div>
          <button class="primary">提问</button>
          <div class="two-actions">
            <button class="warning">线索</button>
            <button class="danger">猜答案</button>
          </div>
        </aside>
        <section class="timeline">
          <article class="timeline-item">
            <span class="dot">1</span>
            <div class="timeline-bubble">
              <small class="compact-label">玩家提问</small>
              <strong>它是人工制品吗？</strong>
              <span class="answer-pill">AI：不是</span>
            </div>
          </article>
          <article class="timeline-item">
            <span class="dot">2</span>
            <div class="timeline-bubble">
              <small class="compact-label">玩家提问</small>
              <strong>它比人大吗？</strong>
              <span class="answer-pill">AI：是也不是</span>
            </div>
          </article>
          <article class="timeline-item">
            <span class="dot">?</span>
            <div class="timeline-bubble auto-card">
              <small class="compact-label">连环探问模式可复用</small>
              <strong>再问个随机问题</strong>
              <button class="secondary">抽取下一问</button>
            </div>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
